<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TeamTaskManager logo</title>
  <desc id="desc">Three team members above a blue T-shaped symbol and a checklist with a checkmark.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1687FF"/>
      <stop offset="1" stop-color="#0754E8"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#079BFF"/>
    </linearGradient>
  </defs>

  <!-- Team members -->
  <circle cx="180" cy="104" r="28" fill="url(#blue)"/>
  <path d="M132 164c4-25 21-38 48-38s44 13 48 38v9h-96z" fill="url(#blue)"/>
  <circle cx="256" cy="76" r="36" fill="url(#cyan)"/>
  <path d="M201 150c5-31 25-47 55-47s50 16 55 47v22H201z" fill="url(#cyan)"/>
  <circle cx="332" cy="104" r="28" fill="url(#blue)"/>
  <path d="M284 164c4-25 21-38 48-38s44 13 48 38v9h-96z" fill="url(#blue)"/>

  <!-- T-shaped task/team mark -->
  <path d="M111 188a14 14 0 0 1 14-14h262a14 14 0 0 1 14 14v30a14 14 0 0 1-14 14H289v130a34 34 0 0 1-34 34h-10a34 34 0 0 1-34-34V232h-86a14 14 0 0 1-14-14z" fill="url(#cyan)"/>
  <path d="M209 232h80v130a34 34 0 0 1-34 34h-12a34 34 0 0 1-34-34z" fill="url(#blue)"/>

  <!-- Checklist card -->
  <path d="M326 280a16 16 0 0 1 16-16h35a16 16 0 0 1 16 16v124a18 18 0 0 1-18 18h-69a18 18 0 0 1-18-18v-95a18 18 0 0 1 18-18h20z" fill="#F8FAFC"/>
  <path d="m311 326 15 15 30-32" fill="none" stroke="url(#cyan)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M307 360h52M307 378h52M307 396h52" fill="none" stroke="url(#blue)" stroke-width="7" stroke-linecap="round"/>
</svg>
